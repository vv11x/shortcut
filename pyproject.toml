[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shortcut"
version = "1.0.0"
description = "A Windows desktop dock for organizing shortcuts"
requires-python = ">=3.13"
dependencies = ["PySide6==6.11.1"]
readme = "README.md"
license = "MIT"
authors = [{ name = "vv11x" }]
classifiers = [
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
]

[project.scripts]
shortcut = "shortcut.entry:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
